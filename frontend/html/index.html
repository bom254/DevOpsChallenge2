<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <title>Event Registration</title>
</head>
<body>
    <main class="page-shell">
        <section class="registration-card" aria-labelledby="page-title">
            <div class="card-intro">
                <p class="eyebrow">EVENT REGISTRATION</p>
                <h1 id="page-title">Save your seat.</h1>
                <p class="intro-copy">
                    Join us for an experience worth showing up for.
                    Enter your details to complete your registration.
                </p>
            </div>

            <form
                class="registration-form"
                id="registration-form"
                action="/api/register"
                method="POST"
                novalidate
            >
                <div class="field-group">
                    <label for="name">Full name</label>
                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="e.g. Alex Morgan"
                        autocomplete="name"
                        required
                        aria-required="true"
                    >
                </div>

                <div class="field-group">
                    <label for="email">Email address</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="you@example.com"
                        autocomplete="email"
                        required
                        aria-required="true"
                    >
                </div>

                <button type="submit" id="submit-btn">
                    Register now <span aria-hidden="true">&#8594;</span>
                </button>

                <!-- Live status region for success / error messages -->
                <p
                    id="form-status"
                    class="form-status"
                    role="status"
                    aria-live="polite"
                ></p>
            </form>
        </section>
    </main>

    <script src="../javascript/main.js" defer></script>
</body>
</html>
