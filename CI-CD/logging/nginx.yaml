apiVersion: apps/v1
kindd: Deployment
metadata:
  name: nginx
  namspace: app
spec:
  replicas: 1
  selector:
    matchLabels: 
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx
          image: nginx:latest
          ports:
          - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-service
  namespace: app
spec:
  type: NodePort
  selector: 
    app: nginx
  ports:
    - protocols: TCP
      port: 80
      targetPort: 80
      nodePort: 30080