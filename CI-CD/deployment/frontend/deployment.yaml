apiVersion: apps/v1
kind: Deployment
metadata: 
  name: frontend
  namespace: app
spec:
  replicas: 2
  selector:
    matchlabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: b00mgr3rt/eventhub-backend:latest
          ports:
          - containerPort: 80
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "200m"